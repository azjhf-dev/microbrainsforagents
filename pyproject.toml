[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-microbrains"
version = "0.5.0"
description = "4-layer structural pre-filter and analytical Hopfield-Transformer microbrain SDK (v0.5.0): AST/signature diffing & Causal SCM rollout, allowlist shlex parser, bilingual SHA-256 MoE + MCP-Zero narrowing, 42/42 alpha=0.05 Mondrian conformal calibration, SHA-256 checksums, sliding-window ACI drift monitoring, and staged EWC plasticity"
readme = "README.md"
authors = [
    { name = "Dmitry Tikov", email = "drtikov@gmail.com" }
]
license = { text = "PolyForm Noncommercial License 1.0.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "ai-agents",
    "micro-transformer",
    "mixture-of-experts",
    "edge-ai",
    "conformal-prediction",
    "vector-symbolic-architecture",
    "opencl",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
opencl = [
    "pyopencl>=2022.1",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/drtikov/microbrainsforagents"
Repository = "https://github.com/drtikov/microbrainsforagents.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["aetheris_microbrains*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.npz", "*.md"]
